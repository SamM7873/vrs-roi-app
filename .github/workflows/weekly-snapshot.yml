name: Weekly HubSpot snapshot

on:
  schedule:
    # 06:00 UTC every Monday (~1am CST / 2am CDT). Adjust the cron if you like.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}   # lets you run it on-demand from the Actions tab

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r scripts/requirements-snapshot.txt

      - name: Run weekly snapshot
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/weekly_snapshot.py
